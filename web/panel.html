<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farfield</title>
<style>
  :root { color-scheme: light dark; --bg:#fafaf9; --fg:#1c1b1a; --muted:#6b6963; --line:#dcdad4; --card:#fff; --ok:#2e7d4f; --warn:#a86a00; --accent:#1c1b1a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151412; --fg:#f0eeea; --muted:#a09d95; --line:#33312d; --card:#1d1c19; --ok:#5cc58a; --warn:#e0a53a; --accent:#f0eeea; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif, Arial; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 64px; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin:0; font-weight:600; }
  h2 { font-size: 15px; margin:0 0 8px; font-weight:600; }
  .state { display:flex; align-items:center; gap:8px; font-weight:600; }
  .dot { width:10px; height:10px; border-radius:50%; background:#999; }
  .dot.on { background: var(--ok); } .dot.paused { background: var(--warn); }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  p { margin: 6px 0; } .muted { color: var(--muted); }
  ul { margin: 6px 0; padding-left: 18px; } li { margin: 3px 0; }
  button, input { font: inherit; }
  button { padding: 6px 12px; border-radius: 8px; border:1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button:disabled { opacity:.5; cursor: default; }
  input[type=text], input[type=email] { width:100%; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background: transparent; color: var(--fg); margin: 3px 0 8px; }
  label { display:block; font-size: 13px; color: var(--muted); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .folder { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:4px 0; border-bottom:1px solid var(--line); word-break: break-all; }
  .err { color: #b3261e; } @media (prefers-color-scheme: dark) { .err { color:#ff8a80; } }
  a { color: inherit; }
  :root { color-scheme: light; }
</style>
<link rel="stylesheet" href="/farfield-look.css">
</head>
<body class="ff-panel">
<header class="ff-bar">
  <div class="ff-bar-in">
    <h1 style="margin:0;margin-right:auto"><img src="/logo/primary-dark.svg" alt="Farfield"></h1>
    <div class="state"><span id="dot" class="dot"></span><span id="stateText">Checking…</span></div>
    <button id="pauseBtn" type="button">Pause</button>
    <a href="/dashboard.html" id="dashLink">Open dashboard</a>
  </div>
</header>
<main>

  <section aria-labelledby="h-reads">
    <h2 id="h-reads">What Farfield reads</h2>
    <p class="muted">Only Excel, Word and PowerPoint files in these folders, and only files that appeared after Farfield started. It does not read your screen, record keystrokes, or take screenshots.</p>
    <div id="folders"></div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="folderInput" placeholder="Folder to watch, for example C:\Users\you\Downloads" aria-label="Folder to watch" style="flex:1;min-width:220px;margin:0">
      <button type="button" id="addFolder">Add folder</button>
    </div>
    <p id="folderMsg" class="err" role="alert"></p>
  </section>

  <section aria-labelledby="h-found">
    <h2 id="h-found">What it has found</h2>
    <p id="foundText" class="muted"></p>
    <ul id="latest"></ul>
    <p id="screenLine" class="muted"></p>
    <div class="row"><button type="button" id="scanBtn">Check now</button><span id="scanMsg" class="muted"></span></div>
  </section>

  <section aria-labelledby="h-company">
    <h2 id="h-company">Your company</h2>
    <div id="companyView"></div>
  </section>

  <section aria-labelledby="h-collect">
    <h2 id="h-collect">What is collected</h2>
    <p id="collectText"></p>
  </section>
</main>
<script src="/panel.js"></script>
</body>
</html>
